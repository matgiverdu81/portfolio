<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery — Elin Cole Photography</title>
  <meta name="description" content="Photo gallery by Elin Cole." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <a class="wordmark" href="index.html">Elin&nbsp;Cole</a>
    <nav class="site-nav">
      <a href="index.html#work">Work</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main>
    <a class="back-link" href="index.html#work">
      <svg width="14" height="10" viewBox="0 0 14 10" fill="none" aria-hidden="true">
        <path d="M5 1 1 5l4 4M1 5h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      All work
    </a>

    <div class="gallery-header">
      <p class="gallery-category" id="galCategory"></p>
      <h1 id="galTitle"></h1>
      <p class="gallery-desc" id="galDesc"></p>
      <p class="gallery-meta" id="galMeta"></p>
    </div>

    <div class="masonry-grid" id="masonryGrid"></div>
  </main>

  <footer class="site-footer">
    <p>© 2026 Elin Cole Photography</p>
    <p class="credit">Placeholder photographs via Picsum Photos, used here for demonstration only.</p>
  </footer>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M1 1l16 16M17 1 1 17" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button class="lightbox-prev" id="lightboxPrev" aria-label="Previous photo">
      <svg width="12" height="20" viewBox="0 0 12 20" fill="none" aria-hidden="true"><path d="M10 1 1 10l9 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="" />
    <button class="lightbox-next" id="lightboxNext" aria-label="Next photo">
      <svg width="12" height="20" viewBox="0 0 12 20" fill="none" aria-hidden="true"><path d="M2 1l9 9-9 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <p class="lightbox-counter" id="lightboxCounter"></p>
  </div>

  <script src="js/data.js"></script>
  <script src="js/photos-loader.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
